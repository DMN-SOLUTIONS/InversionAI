name: InversionAI - Build & Deploy

on:
  push:
    branches:
      - main        # Deploy to dev
      - staging     # Deploy to staging
      - production  # Deploy to production
  pull_request:
    branches: [main]

env:
  ACR_NAME: inversionaicr
  ACR_LOGIN_SERVER: inversionaicr.azurecr.io
  IMAGE_NAME: inversionai

jobs:
  # ===========================================================================
  # Stage 1: Test
  # ===========================================================================
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: pytest tests/ -v --cov=. --cov-report=term-missing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_PROVIDER: anthropic
          LLM_MODEL: claude-sonnet-4-20250514

  # ===========================================================================
  # Stage 2: Build & Push Docker Image
  # ===========================================================================
  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      environment: ${{ steps.meta.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine environment and tag
        id: meta
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          case "$BRANCH" in
            main)       ENV="dev";     TAG="dev-${{ github.sha }}" ;;
            staging)    ENV="staging"; TAG="staging-${{ github.sha }}" ;;
            production) ENV="prod";    TAG="prod-${{ github.sha }}" ;;
          esac
          echo "environment=$ENV" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "🏷️ Environment: $ENV | Tag: $TAG"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build and push image
        run: |
          docker build -t ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }} .
          docker tag ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }} \
                     ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.environment }}-latest
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.environment }}-latest

  # ===========================================================================
  # Stage 3: Deploy to Dev (auto on push to main)
  # ===========================================================================
  deploy-dev:
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.environment == 'dev'
    environment:
      name: dev
      url: https://ca-inversionai-dev.politedesert-6f15044e.australiaeast.azurecontainerapps.io
    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to dev
        run: |
          az containerapp update \
            --name ca-inversionai-dev \
            --resource-group rg-inversionai-dev \
            --image ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image_tag }}

      - name: Verify deployment
        run: |
          sleep 30
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            https://ca-inversionai-dev.politedesert-6f15044e.australiaeast.azurecontainerapps.io/_stcore/health)
          if [ "$STATUS" != "200" ]; then
            echo "❌ Health check failed with status $STATUS"
            exit 1
          fi
          echo "✅ Dev deployment healthy"

  # ===========================================================================
  # Stage 4: Deploy to Staging (auto on push to staging branch)
  # ===========================================================================
  deploy-staging:
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.environment == 'staging'
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to staging
        run: |
          az containerapp update \
            --name ca-inversionai-staging \
            --resource-group rg-inversionai-staging \
            --image ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image_tag }}

      - name: Verify deployment
        run: |
          FQDN=$(az containerapp show \
            --name ca-inversionai-staging \
            --resource-group rg-inversionai-staging \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          sleep 30
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://$FQDN/_stcore/health")
          if [ "$STATUS" != "200" ]; then
            echo "❌ Staging health check failed with status $STATUS"
            exit 1
          fi
          echo "✅ Staging deployment healthy at https://$FQDN"

  # ===========================================================================
  # Stage 5: Deploy to Production (requires manual approval)
  # ===========================================================================
  deploy-prod:
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.environment == 'prod'
    environment:
      name: production  # <-- Requires manual approval in GitHub settings
    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to production
        run: |
          az containerapp update \
            --name ca-inversionai-prod \
            --resource-group rg-inversionai-prod \
            --image ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image_tag }}

      - name: Verify deployment
        run: |
          FQDN=$(az containerapp show \
            --name ca-inversionai-prod \
            --resource-group rg-inversionai-prod \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          sleep 30
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://$FQDN/_stcore/health")
          if [ "$STATUS" != "200" ]; then
            echo "❌ Production health check failed with status $STATUS"
            exit 1
          fi
          echo "✅ Production deployment healthy at https://$FQDN"
